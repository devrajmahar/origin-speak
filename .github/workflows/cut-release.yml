name: "Cut Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to release (example: 0.1.31)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  cut-release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required to dispatch release.yml; tags pushed with GITHUB_TOKEN do not trigger workflows.
      actions: write
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Cut Release must run on main (got ${GITHUB_REF})."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Release exactly the commit the checks ran against.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require a new tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists."
            exit 1
          fi

      - name: Bump version files
        run: python3 scripts/version.py bump "${{ inputs.version }}"

      - name: Commit and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No version changes detected."
            exit 1
          fi

          git add backend/Cargo.toml backend/Cargo.lock native/Cargo.toml native/Cargo.lock
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          # Rejected (non-fast-forward) if main moved after the checks started.
          git push origin HEAD:refs/heads/main
          git push origin "v${VERSION}"

      - name: Start native package publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "version=$VERSION"
