name: "Release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches native version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --manifest-path native/Cargo.toml --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [[ "$VERSION" != "$CARGO_VERSION" ]]; then
            echo "Tag version $VERSION does not match native/Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  windows:
    runs-on: windows-latest
    needs: metadata
    env:
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
      VULKAN_SDK_VERSION: "1.4.357.0"
      VULKAN_SDK_SHA256: "81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Vulkan SDK build tools
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK-$env:VULKAN_SDK_VERSION"
          $installerPath = Join-Path $env:RUNNER_TEMP "vulkan-sdk.exe"
          $installerUrl = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkan_sdk.exe"

          Invoke-WebRequest -UseBasicParsing -Uri $installerUrl -OutFile $installerPath
          $actualHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:VULKAN_SDK_SHA256) {
            throw "Vulkan SDK installer SHA-256 mismatch: expected $env:VULKAN_SDK_SHA256, got $actualHash"
          }

          & $installerPath `
            --root $sdkRoot `
            --accept-licenses `
            --default-answer `
            --confirm-command install `
            copy_only=1
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK installer failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $sdkRoot "Bin\glslc.exe") -PathType Leaf)) {
            throw "Pinned Vulkan SDK did not provide Bin\glslc.exe"
          }

          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VK_SDK_PATH=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 't')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $sdkRoot "Bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Detect Windows signing capability
        id: windows-trust
        shell: pwsh
        run: |
          $values = @(
            $env:WINDOWS_CERTIFICATE_PFX_BASE64,
            $env:WINDOWS_CERTIFICATE_PASSWORD,
            $env:WINDOWS_SIGN_TIMESTAMP_URL
          )
          $present = @($values | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($present -eq $values.Count) {
            "signing_available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "WINDOWS_SIGNING_AVAILABLE=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "WINDOWS_RELEASE_TRUST=signed-and-timestamped" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "signing_available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "WINDOWS_SIGNING_AVAILABLE=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "WINDOWS_RELEASE_TRUST=unsigned" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            if ($present -gt 0) {
              Write-Warning "Windows signing credentials are incomplete; publishing unsigned artifacts."
            } else {
              Write-Host "Windows signing credentials are absent; publishing unsigned artifacts."
            }
          }

      - name: Prepare Windows signing certificate
        if: steps.windows-trust.outputs.signing_available == 'true'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "origin-speak-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          )
          "WINDOWS_SIGNING_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build CLI manager and silent runtime
        run: cargo build --manifest-path native/Cargo.toml --release --locked --features gpu-vulkan --bin origin --bin origin-runtime

      - name: Package Windows CLI/runtime artifacts
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File native/packaging/windows/package.ps1
          -Version "${{ needs.metadata.outputs.version }}"
          -OutputDir "dist/native/windows"
          -ManagerBinaryPath "$env:CARGO_TARGET_DIR\release\origin.exe"
          -RuntimeBinaryPath "$env:CARGO_TARGET_DIR\release\origin-runtime.exe"

      - name: Record Windows trust status
        shell: pwsh
        run: |
          @(
            "platform=windows-x86_64",
            "trust=$env:WINDOWS_RELEASE_TRUST"
          ) | Set-Content -LiteralPath "dist/native/windows/TRUST-windows.txt" -Encoding ascii

      - name: Remove Windows signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_CERTIFICATE_PATH -and (Test-Path -LiteralPath $env:WINDOWS_SIGNING_CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:WINDOWS_SIGNING_CERTIFICATE_PATH -Force
          }

      - name: Upload Windows CLI/runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: origin-speak-windows-${{ needs.metadata.outputs.version }}
          path: |
            dist/native/windows/*.exe
            dist/native/windows/*.sha256
            dist/native/windows/SHA256SUMS-windows.txt
            dist/native/windows/TRUST-windows.txt
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    needs: metadata
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_CODESIGN_IDENTITY_SECRET: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Detect macOS signing and notarization capability
        id: macos-trust
        shell: bash
        run: |
          set -euo pipefail
          required=(
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
            MACOS_CODESIGN_IDENTITY_SECRET
            APPLE_ID
            APPLE_TEAM_ID
            APPLE_APP_SPECIFIC_PASSWORD
          )
          present=0
          for variable in "${required[@]}"; do
            [[ -n "${!variable:-}" ]] && present=$((present + 1))
          done
          if [[ "$present" -eq "${#required[@]}" ]]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
            echo "MACOS_RELEASE_TRUST=developer-id-notarized" >> "$GITHUB_ENV"
            echo "MACOS_NOTARIZE=1" >> "$GITHUB_ENV"
            echo "MACOS_CODESIGN_IDENTITY=$MACOS_CODESIGN_IDENTITY_SECRET" >> "$GITHUB_ENV"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "MACOS_RELEASE_TRUST=ad-hoc" >> "$GITHUB_ENV"
            echo "MACOS_NOTARIZE=0" >> "$GITHUB_ENV"
            echo "MACOS_CODESIGN_IDENTITY=-" >> "$GITHUB_ENV"
            if [[ "$present" -gt 0 ]]; then
              echo "::warning::macOS signing/notarization credentials are incomplete; publishing ad-hoc signed artifacts."
            else
              echo "macOS signing/notarization credentials are absent; publishing ad-hoc signed artifacts."
            fi
          fi

      - name: Import Developer ID certificate
        if: steps.macos-trust.outputs.notarize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/origin-speak-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/origin-speak-signing.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ["RUNNER_TEMP"], "origin-speak-signing.p12").write_bytes(
              base64.b64decode(os.environ["MACOS_CERTIFICATE_P12_BASE64"], validate=True)
          )
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$MACOS_CODESIGN_IDENTITY"
          echo "MACOS_RELEASE_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          rm -f "$CERTIFICATE_PATH"

      - name: Build universal CLI manager and silent runtime
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path native/Cargo.toml --release --locked --features gpu-metal --target aarch64-apple-darwin --bin origin --bin origin-runtime
          cargo build --manifest-path native/Cargo.toml --release --locked --features gpu-metal --target x86_64-apple-darwin --bin origin --bin origin-runtime
          mkdir -p native/target/release
          for binary in origin origin-runtime; do
            lipo -create \
              "native/target/aarch64-apple-darwin/release/$binary" \
              "native/target/x86_64-apple-darwin/release/$binary" \
              -output "native/target/release/$binary"
            ARCHS="$(lipo -archs "native/target/release/$binary")"
            [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]
          done

      - name: Package macOS CLI/runtime artifacts
        shell: bash
        run: |
          bash native/packaging/macos/package.sh "${{ needs.metadata.outputs.version }}" "dist/native/macos"

      - name: Inspect packaged runtime app and manager
        shell: bash
        run: |
          set -euo pipefail
          ARCHS="$(lipo -archs "dist/native/macos/Origin Speak.app/Contents/MacOS/origin-runtime")"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]
          plutil -lint "dist/native/macos/Origin Speak.app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "dist/native/macos/Origin Speak.app"
          codesign --verify --strict --verbose=2 dist/native/macos/origin-speak-*-macos-universal
          if [[ "$MACOS_RELEASE_TRUST" == "developer-id-notarized" ]]; then
            xcrun stapler validate "dist/native/macos/Origin Speak.app"
          fi

      - name: Record macOS trust status
        shell: bash
        run: |
          printf 'platform=macos-universal\ntrust=%s\n' "$MACOS_RELEASE_TRUST" > dist/native/macos/TRUST-macos.txt

      - name: Remove macOS signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${MACOS_RELEASE_KEYCHAIN:-}" && -f "$MACOS_RELEASE_KEYCHAIN" ]]; then
            security delete-keychain "$MACOS_RELEASE_KEYCHAIN" || true
          fi

      - name: Upload macOS CLI/runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: origin-speak-macos-${{ needs.metadata.outputs.version }}
          path: |
            dist/native/macos/origin-speak-*-macos-universal
            dist/native/macos/*.zip
            dist/native/macos/SHA256SUMS-macos.txt
            dist/native/macos/TRUST-macos.txt
          if-no-files-found: error

  publish-github-release:
    runs-on: ubuntu-latest
    needs: [metadata, windows, macos]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: origin-speak-*
          path: dist/publish
          merge-multiple: true

      - uses: actions/checkout@v4

      - name: Generate CLI/bootstrap update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.metadata.outputs.version }}"
          python3 native/packaging/generate_update_manifest.py \
            --version "$VERSION" \
            --public-base-url "https://github.com/devrajmahar/origin-speak" \
            --release-prefix "releases/download/v$VERSION" \
            --artifact-root dist/publish \
            --output dist/publish/bootstrap-update.json

      - name: Validate CLI/bootstrap update contract
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.metadata.outputs.version }}"
          python3 native/packaging/validate_update_manifest.py \
            --manifest dist/publish/bootstrap-update.json \
            --version "$VERSION" \
            --public-base-url "https://github.com/devrajmahar/origin-speak" \
            --release-prefix "releases/download/v$VERSION" \
            --artifact-root dist/publish

      - name: Compose GitHub Release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.metadata.outputs.version }}"
          WINDOWS_TRUST="$(sed -n 's/^trust=//p' dist/publish/TRUST-windows.txt)"
          MACOS_TRUST="$(sed -n 's/^trust=//p' dist/publish/TRUST-macos.txt)"
          if [[ "$WINDOWS_TRUST" == "signed-and-timestamped" ]]; then
            WINDOWS_NOTE="signed and timestamped"
          else
            WINDOWS_NOTE="unsigned (Windows signing credentials were unavailable or incomplete)"
          fi
          if [[ "$MACOS_TRUST" == "developer-id-notarized" ]]; then
            MACOS_NOTE="Developer ID signed and Apple notarized"
          else
            MACOS_NOTE="ad-hoc signed and not notarized (Apple release credentials were unavailable or incomplete)"
          fi
          cat > dist/release-notes.md <<EOF
          Origin Speak v$VERSION

          Release assets include the origin CLI manager, the origin-runtime resident runtime, platform checksum files, and bootstrap-update.json.

          Trust status:
          - Windows: $WINDOWS_NOTE.
          - macOS: $MACOS_NOTE.

          Update manifest URLs point to this GitHub Release under releases/download/v$VERSION.
          EOF

      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.metadata.outputs.version }}"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Origin Speak $TAG" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" --verify-tag --title "Origin Speak $TAG" --notes-file dist/release-notes.md
          fi
          mapfile -t ASSETS < <(find dist/publish -maxdepth 1 -type f -print | sort)
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
