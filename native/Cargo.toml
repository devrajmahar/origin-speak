[package]
name = "listenos-native"
version = "0.1.21"
edition = "2024"
publish = false

[features]
default = []
gpu-vulkan = ["voice_os_lib/gpu-vulkan"]
gpu-metal = ["voice_os_lib/gpu-metal"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.5" }
gpui-base = "=0.6.1"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.5" }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "sync", "time"] }
voice_os_lib = { package = "listenos-backend", path = "../backend" }
chrono = "0.4"
futures-util = "0.3"
reqwest = { version = "0.11", features = ["json", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
embed-resource = "3.0.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSButton", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
