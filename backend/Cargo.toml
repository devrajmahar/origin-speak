[package]
name = "listenos-backend"
version = "0.1.21"
description = "ListenOS - AI-Powered Voice Control System"
authors = ["ListenOS"]
license = "PROPRIETARY"
edition = "2021"

[features]
default = []
# VoxType's deployable Whisper strategy uses Vulkan as the cross-vendor
# Windows GPU backend and Metal on macOS. These SDKs are build-time inputs;
# shipped users only need a working graphics driver/runtime.
gpu-vulkan = ["whisper-rs/vulkan"]
gpu-metal = ["whisper-rs/metal"]

[lib]
name = "voice_os_lib"
crate-type = ["rlib"]

[dependencies]
# Global shortcuts
global-hotkey = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio Capture
cpal = "0.15"
rubato = "0.16"

# Local speech-to-text
whisper-rs = "0.16.0"

# Async Runtime
tokio = { version = "1", features = ["full"] }

futures-util = "0.3"

# HTTP for model downloads and local integrations
reqwest = { version = "0.11", features = ["blocking", "json", "stream"] }

# System Control
enigo = "0.2"

# Logging
log = "0.4"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# URL handling
url = "2"

# SQLite for persistent storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Clipboard
arboard = "3"

# Directory paths
dirs-next = "2"

# Lazy initialization
lazy_static = "1.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging", 
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse"
] }

[profile.release]
strip = true
lto = true
# Whisper inference is compute-bound: `opt-level = "z"` (size) costs
# 20-40% CPU throughput versus speed optimization. Keep LTO + single
# codegen unit for speed; binary size growth is negligible next to models.
opt-level = 3
codegen-units = 1
panic = "abort"
